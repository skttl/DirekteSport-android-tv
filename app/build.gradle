plugins {
    id 'com.android.application'
}

android {
    namespace 'dk.direktesport.tv'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dk.direktesport.tv'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('buildVersionCode') ?: '1').toString())
        versionName (project.findProperty('buildVersionName') ?: '0.1.0').toString()
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    if (keystorePath && keystorePassword) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias 'direktesport-tv'
                keyPassword keystorePassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    def media3Version = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
}
